<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="appicon8.png">
  <title>Shakthi Sankhya</title>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      color: #30415d;
      background: linear-gradient(120deg, #68c2be 0%, #a0d8ef 60%, #e4ffe4 100%);
    }
    .header {
      background: rgba(255,255,255,0.8);
      padding: 24px 0 12px 0;
      text-align: center;
      border-bottom: 1px solid #e5e9ea;
    }
    .header h1 {
      margin: 0;
      font-size: 2.4em;
      font-weight: 600;
      letter-spacing: 1px;
      color: #187684;
    }
    nav {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin: 18px 0;
    }
    nav a {
      text-decoration: none;
      font-weight: 500;
      color: #2d767f;
      padding: 8px 16px;
      border-radius: 18px;
      transition: background 0.2s;
      background: rgba(255,255,255,0.5);
    }
    nav a:hover, nav a.active {
      background: #e8ecf1;
      color: #187684;
    }
    .container {
      max-width: 620px;
      margin: 3em auto;
      background: #fff;
      padding: 42px 28px 32px 28px;
      box-shadow: 0 4px 24px rgba(48,65,93,0.06);
      border-radius: 16px;
      text-align: center;
    }
    .permission {
      margin: 28px 0 24px 0;
      background: #e7fbf7;
      color: #187684;
      border-radius: 12px;
      padding: 16px;
    }
    .contact {
      margin-top: 24px;
      color: #187684;
      font-size: 1em;
    }
    .content {
      max-width: 680px;
      margin: 44px auto;
      padding: 32px;
      background: rgba(255,255,255,0.8);
      border-radius: 18px;
      box-shadow: 0 2px 24px 0 rgba(48,65,93,0.06);
    }
    .marketing-block {
      background: #e6f4f1;
      border-radius: 14px;
      padding: 24px 18px;
      margin-bottom: 30px;
      box-shadow: 0 2px 16px #e2eaea;
      text-align: center;
    }
    .marketing-block h2 {
      margin-top: 0;
      color: #20797d;
    }
    .appstore-btn {
      display:inline-block;
      background:#187684;
      color:#fff;
      font-weight:600;
      font-size:1.15em;
      padding:10px 28px;
      border-radius:8px;
      margin: 18px 0 10px 0;
      text-decoration:none;
      letter-spacing:1px;
      transition:background 0.15s;
    }
    .appstore-btn:hover {
      background: #145b62;
    }
    .features-list {
      margin-top:14px;
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      justify-content:center;
      font-size:1em;
    }
    .feature-tag {
      background:#b1ebe1;
      color:#287d7f;
      padding:6px 18px;
      margin:0 4px 6px 0;
      border-radius:16px;
      display:inline-block;
      font-weight:500;
      letter-spacing:0.5px;
    }
    .screenshots-row {
      margin-top:20px;
      text-align:center;
    }
    .screenshots-row img {
      max-width:130px;
      margin:0 8px 0 8px;
      border-radius:10px;
      box-shadow:0 1px 10px #e0e7ef;
      vertical-align:middle;
    }
    .faq-list .faq {
      margin-bottom: 28px;
    }
    .faq-list h3 {
      margin-bottom: 6px;
      font-weight: 500;
      color: #205071;
    }
    .faq-list p {
      margin: 0 0 10px 0;
      color: #375160;
      font-size: 1em;
    }
    @media (max-width: 600px) {
      .content {
        padding: 18px;
        margin: 24px 6px;
      }
      nav {
        gap: 12px;
        font-size: 0.95em;
      }
      .screenshots-row img {
        max-width: 100px;
        margin:0 4px 8px 0;
      }
      .features-list { flex-direction:column; gap:6px;}
    }
    .back-to-top {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #187684;
    color: white;
    padding: 12px 16px;
    border-radius: 50%;
    font-size: 18px;
    font-weight: bold;
    box-shadow: 0 4px 16px rgba(24, 118, 132, 0.3);
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
    z-index: 100;
}
.back-to-top:hover {
    background: #145b62;
    transform: translateY(-2px);
}
.back-to-top.show {
    opacity: 1;
    visibility: visible;
}
@media (max-width: 600px) {
  .main-menu {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .main-menu a {
    width: 100%;
    padding: 12px 0;
    text-align: left;
    border-bottom: 1px solid #eee;
  }
}
  </style>
</head>
